<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="../css/styles.css" rel="stylesheet" type="text/css">
</head>

<body>
  <header class="main-header">
    <nav class="navbar">
      <p class="logo">videobelajar</p>
    </nav>
  </header>
  <main>
    <div class="auth-card">
      <header class="auth-card-header">
        <h1 class="text-3xl">Masuk ke Akun</h1>
        <p>Yuk, lanjutin belajarmu di videobelajar.</p>
      </header>
      <form class="auth-card-form" action="#">
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-input" type="email" name="email" id="email">
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrap">
            <input class="form-input has-icon" type="password" name="password" id="password">
            <img class="input-icon" src="../assets/svg/eye.svg" alt="Eye icon">
          </div>
        </div>
        <a class="auth-forgot-link" href="#">Lupa Password?</a>
        <div class="form-actions">
          <div class="auth-buttons">
            <button class="btn" type="submit">Masuk</button>
            <a class="btn" href="#">Daftar</a>
          </div>
          <div class="action-divider">
            <hr>
            <p>atau</p>
            <hr>
          </div>
          <a class="btn btn-auth-google" href="#">
            <img class="icon" src="../assets/svg/google.svg" alt="Google icon">
            Daftar dengan Google
          </a>
        </div>
      </form>
    </div>
  </main>
</body>

</html>
